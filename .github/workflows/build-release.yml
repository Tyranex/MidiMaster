name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish App
      run: dotnet publish -c Release

    - name: Zip Release
      run: |
        Compress-Archive -Path "bin\Release\net10.0-windows\win-x64\publish\MidiMaster.exe" -DestinationPath "MidiMaster_Release_${{ github.event.release.tag_name }}.zip" -Force

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      with:
        files: MidiMaster_Release_*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
